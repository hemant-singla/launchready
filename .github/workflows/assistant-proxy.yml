name: Assistant proxy

# Deploys the Cloudflare Worker in proxy/ that holds the Anthropic API key.
# Needs repository secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and
# ANTHROPIC_API_KEY; without them the job explains what's missing and skips.
on:
  push:
    branches: [main]
    paths:
      - proxy/**
      - src/agent/assistant.ts
      - .github/workflows/assistant-proxy.yml
  workflow_dispatch:

concurrency:
  group: assistant-proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::Assistant proxy not deployed: add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and ANTHROPIC_API_KEY as repository secrets (see docs/ASSISTANT.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.config.outputs.ready == 'true'
      - name: Deploy worker
        if: steps.config.outputs.ready == 'true'
        run: npx --yes wrangler@4.156.0 deploy --config proxy/wrangler.toml
      - name: Set API key secret
        if: steps.config.outputs.ready == 'true'
        run: printf '%s' "$ANTHROPIC_API_KEY" | npx --yes wrangler@4.156.0 secret put ANTHROPIC_API_KEY --config proxy/wrangler.toml
